<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카들리 앱 모드 시뮬레이션</title>
  <link rel="stylesheet" href="../css/style.css">
  <script>
    // 안드로이드 앱(Capacitor) 환경을 흉내 냅니다. 실제 네이티브 기능 대신 기록만 남깁니다.
    window.__calls = [];
    window.__listeners = {};
    const fake = name => new Proxy({}, {
      get: (_, method) => {
        if (method === 'addListener') return (event, cb) => ((window.__listeners[event] = cb), { remove() {} });
        return async (args) => {
          window.__calls.push(name + '.' + String(method));
          (window.__args ||= {})[String(method)] = args;
          (window.__argLog ||= []).push([name + '.' + String(method), args]);
          if (method === 'findContact') return { matches: window.__fakeMatches || [] };
          if (method === 'recognizeText') return window.__fakeOcr || { text: '', lines: [] };
          if (method === 'scanDocument') return window.__fakeScan || { images: [], cancelled: true };
          if (method === 'authorize') return { accessToken: 'fake-token' };
          if (method === 'openNewContact') return { saved: true };
          return {};
        };
      },
    });
    // Google Drive API 흉내 (로그인 → 동기화 흐름 확인용)
    const realFetch = window.fetch.bind(window);
    window.__drive = { files: {} };
    window.fetch = async (url, opts = {}) => {
      const u = String(url);
      if (!u.includes('googleapis.com')) return realFetch(url, opts);
      let meta = ''; try { if (opts.body instanceof FormData) meta = await opts.body.get('metadata').text(); else if (typeof opts.body === 'string') meta = opts.body; } catch (e) {}
      (window.__fetchLog ||= []).push([opts.method || 'GET', u.replace('https://www.googleapis.com', ''), meta]);
      const json = obj => new Response(JSON.stringify(obj), { status: 200, headers: { 'Content-Type': 'application/json' } });
      if (u.includes('/about')) return json({ user: { displayName: '테스트 사용자', emailAddress: 'tester@example.com' } });
      if (u.includes('/files?') && (!opts.method || opts.method === 'GET')) return json({ files: [] });
      if (u.includes('alt=media')) return json({ cards: [], groups: [] });
      if (opts.method === 'POST') { const id = 'f' + Math.random().toString(36).slice(2, 8); window.__drive.files[id] = true; return json({ id }); }
      return json({ id: 'x', trashed: false });
    };
    window.Capacitor = {
      isNativePlatform: () => true,
      getPlatform: () => 'android',
      Plugins: { CardlyNative: fake('CardlyNative'), Share: fake('Share'), Filesystem: fake('Filesystem') },
      registerPlugin: name => fake(name),
    };
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-gallery" accept="image/*" hidden>
  <input type="file" id="file-import" accept=".json,application/json" hidden>
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
