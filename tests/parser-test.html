<style>
  body { font-family: system-ui, sans-serif; padding: 16px; background: #fff; color: #111; }
  .pass { color: #1f9d5c; } .fail { color: #d0393a; }

      { text: 'E. gdhong@cjeng.kr', height: 18 },
      { text: 'www.cjeng.kr', height: 18 },
    ],
    expect: { name: '홍길동', company: '창조이엔지 주식회사', department: '영업팀', title: '부장', phone: '02-1234-5678', fax: '02-1234-5679', mobile: '010-9876-5432', email: 'gdhong@cjeng.kr', website: 'www.cjeng.kr', address: '서울특별시 강남구 테헤란로 123, 5층' },
  },
  {

    text: `(주)한빛소프트웨어
김민수 대표이사
경기도 성남시 분당구 판교역로 235

010.2345.6789
031-8017-1234
minsu.kim@hanbitsw.com`,
    expect: { name: '김민수', title: '대표이사', company: '(주)한빛소프트웨어', mobile: '010-2345-6789', phone: '031-8017-1234', email: 'minsu.kim@hanbitsw.com', address: '경기도 성남시 분당구 판교역로 235 에이치스퀘어 N동 7층' },
  },
  {
    name: '영문 라벨 + 국제번호',
    text: `Tel : +82-2-555-1234
Mobile : +82 10 1111 2222
Fax:02)555-1235
E-mail: lee@abc-eng.co.kr
에이비씨엔지니어링
설계본부 수석연구원
이 영 희
부산광역시 해운대구 센텀중앙로 97`,
    expect: { name: '이영희', phone: '02-555-1234', mobile: '010-1111-2222', fax: '02-555-1235', email: 'lee@abc-eng.co.kr', company: '에이비씨엔지니어링', department: '설계본부', title: '수석연구원', address: '부산광역시 해운대구 센텀중앙로 97' },
  },
  {
    name: '휴대폰/전화 한글 라벨, 대표번호',
    text: `㈜대한건설
공무팀 과장  박지성
전화 1588-1234   휴대폰 010 3333 4444
팩스 02-777-8888
park@daehan.com`,
    expect: { company: '㈜대한건설', name: '박지성', title: '과장', department: '공무팀', phone: '1588-1234', mobile: '010-3333-4444', fax: '02-777-8888', email: 'park@daehan.com' },
  },
  {
    name: '영문 명함',
    text: `GLOBAL TECH SOLUTIONS INC.
John Smith
Senior Manager
john.smith@globaltech.com
+82 10-5555-6666`,
    expect: { company: 'GLOBAL TECH SOLUTIONS INC.', name: 'John Smith', title: 'Senior Manager', mobile: '010-5555-6666', email: 'john.smith@globaltech.com' },
  },
  {
    name: 'TEL/FAX/H.P 라벨 (점·띄어쓰기 오인식)',
    text: `창조이엔지 주식회사
설계팀 과장 홍길동
TEL.: 02-1234-5678
F A X : 02-1234-5679
H. P : 010-9876-5432`,
    expect: { company: '창조이엔지 주식회사', name: '홍길동', title: '과장', department: '설계팀', phone: '02-1234-5678', fax: '02-1234-5679', mobile: '010-9876-5432', memo: '' },
  },
  {
    name: 'TEL 라벨에 010 번호 → 휴대폰',
    text: `(주)대한건설
김철수 대리
TEL: 010-1234-5678
FAX: 031-123-4567`,
    expect: { name: '김철수', mobile: '010-1234-5678', phone: '', fax: '031-123-4567' },
  },
  {
    name: 'TEL 010 + H.P 010 → H.P가 휴대폰, TEL은 전화',
    text: `TEL: 010-1111-2222
H.P: 010-3333-4444`,
    expect: { mobile: '010-3333-4444', phone: '010-1111-2222', memo: '' },
  },
  {
    name: '라벨 열과 번호 열이 따로 인식됨 (ML Kit 블록)',
    lines: [
      { text: '한빛엔지니어링', height: 36 },
      { text: '박영희 부장', height: 30 },
      { text: 'TEL:', height: 16 },
      { text: 'FAX:', height: 16 },
      { text: 'H.P:', height: 16 },
      { text: '02-1234-5678', height: 16 },
      { text: '02-1234-5679', height: 16 },
      { text: '010-9876-5432', height: 16 },
    ],
    expect: { company: '한빛엔지니어링', name: '박영희', phone: '02-1234-5678', fax: '02-1234-5679', mobile: '010-9876-5432', memo: '' },
  },
  {
    name: '위치로 짝짓기: 번호 덩어리가 라벨 덩어리보다 먼저 인식됨',
    lines: [
      { text: '한빛엔지니어링', height: 36, left: 40, top: 30, right: 300, bottom: 66 },
      { text: '박영희 부장', height: 30, left: 40, top: 90, right: 220, bottom: 120 },
      { text: '02-1234-5678', height: 16, left: 110, top: 200, right: 260, bottom: 216 },
      { text: '010-9876-5432', height: 16, left: 110, top: 224, right: 270, bottom: 240 },
      { text: '02-1234-5679', height: 16, left: 110, top: 248, right: 260, bottom: 264 },
      { text: 'TEL:', height: 16, left: 40, top: 200, right: 80, bottom: 216 },
      { text: 'H.P:', height: 16, left: 40, top: 224, right: 80, bottom: 240 },
      { text: 'FAX:', height: 16, left: 40, top: 248, right: 80, bottom: 264 },
    ],
    expect: { company: '한빛엔지니어링', name: '박영희', phone: '02-1234-5678', mobile: '010-9876-5432', fax: '02-1234-5679', memo: '' },
  },
  {
    name: '위치로 짝짓기: 한 줄에 TEL/FAX 두 쌍',
    lines: [
      { text: 'FAX', height: 16, left: 240, top: 200, right: 280, bottom: 216 },
      { text: 'TEL', height: 16, left: 40, top: 200, right: 75, bottom: 216 },
      { text: '02-1234-5678', height: 16, left: 90, top: 200, right: 220, bottom: 216 },
      { text: '02-1234-5679', height: 16, left: 290, top: 200, right: 420, bottom: 216 },
    ],
    expect: { phone: '02-1234-5678', fax: '02-1234-5679', memo: '' },
  },
  {
    name: '한자 이름·직책 + 글자 간격 넓힌 번호 (ML Kit 형태)',
    text: `한빛종합기획
(아크릴ㆍ알루미늄ㆍSUS)명판
인천광역시 동구 송현동 100번지
동구 방축로10번길 20
(산업용품유통센타 10동 100호)
代表
TEL:(032) 555-1201~2
金 東 植
FAX:(032) 555-1 2 0 3
H·P:(010) 1234-5 6 7 8
E-mail:sample@example.com
컴퓨터조각ㆍ명판ㆍ표찰ㆍ각종표시판`,
    expect: {
      company: '한빛종합기획', name: '김동식', title: '대표', phone: '032-555-1201', fax: '032-555-1203', mobile: '010-1234-5678',
      email: 'sample@example.com', address: '인천광역시 동구 송현동 100번지 동구 방축로10번길 20 (산업용품유통센타 10동 100호)',
    },
  },
  {
    name: '실제 웹 OCR 결과 (Tesseract): 긴 대시, H-P, 간격 넓힌 번호',
    text: `한빛종합기획
인천광역시 동구 송현동 100번지
TEL:(032)555—-1201~2
FAX:(032) 555-1 2 0 3
H-P:(010) 1234-5 6 7 8
E—mail : sample @example, com`,
    expect: { phone: '032-555-1201', fax: '032-555-1203', mobile: '010-1234-5678', email: 'sample@example.com', memo: '' },
  },
  {
    name: '한자 이름 두음법칙 (李·林·柳)',
    text: `李 在 明 部長
林 秀 英`,
    expect: { name: '이재명', title: '부장' },
  },
  {
    name: '직책에 성이 붙어 인식 ("대리서 민 호") + 왼쪽 제품 목록 + 영문 그룹명',
    lines: [
      { text: 'Motovario 감속기', height: 22 }, { text: '하이포이드 감속기', height: 22 }, { text: '서보모터', height: 22 },
      { text: 'PLC', height: 22 }, { text: '모터', height: 22 }, { text: '인버터', height: 22 }, { text: '기어드모터', height: 22 },
      { text: '영업2팀', height: 30 },
      { text: '대리서 민 호', height: 42 },
      { text: '한국기어모터', height: 68 },
      { text: 'FA MOTOR GROUP', height: 30 },
      { text: 'TEL: (032) 555-1111 (ft)', height: 26 },
      { text: 'ABC', height: 40 },
      { text: '인천시 남동구 남동서로 100 (고잔동, 남동공단 10B 1L)', height: 24 },
      { text: 'TEL: (032) 555-2222 (직통)', height: 26 },
      { text: 'FAX: (032) 555-3333', height: 26 },
      { text: 'H·P: 010-1234-5678', height: 26 },
      { text: 'http : www.abcfa.com', height: 26 },
      { text: 'E-mail : sales2@abcfa.com', height: 26 },
    ],
    expect: {
      name: '서민호', title: '대리', department: '영업2팀', company: '한국기어모터', phone: '032-555-1111', fax: '032-555-3333',
      mobile: '010-1234-5678', website: 'www.abcfa.com', email: 'sales2@abcfa.com', address: '인천시 남동구 남동서로 100 (고잔동, 남동공단 10B 1L)',
    },
  },
  {
    name: '직책과 이름이 한 글자씩 띄어 인식 ("대 리 서 민 호", 글자 크기 없음)',
    text: `서보모터
기어드모터
영업2팀
대 리 서 민 호
한국기어모터
FA MOTOR GROUP
H·P: 010-1234-5678`,
    expect: { name: '서민호', title: '대리', company: '한국기어모터' },
  },
  {
    name: '번호 뒤에 라벨',
    text: `02-1234-5678 (TEL)
02-1234-5679 (FAX)
010-9876-5432 H.P`,
    expect: { phone: '02-1234-5678', fax: '02-1234-5679', mobile: '010-9876-5432' },
  },
];

const out = document.getElementById('out');
let pass = 0, fail = 0;
const results = [];
for (const c of cases) {
  const r = parseCard(c.lines ? { lines: c.lines } : { text: c.text });
  const errors = Object.entries(c.expect).filter(([k, v]) => r[k] !== v).map(([k, v]) => `${k}: 기대 "${v}" / 실제 "${r[k]}"`);
  errors.length ? fail++ : pass++;
  results.push({ name: c.name, errors });
  out.insertAdjacentHTML('beforeend', `<h3 class="${errors.length ? 'fail' : 'pass'}">${errors.length ? '✗' : '✓'} ${c.name}</h3>${errors.length ? `<pre>${errors.join('\n')}</pre>` : ''}<pre>${JSON.stringify(r, null, 1)}</pre>`);
}

// 기타 유틸
const misc = [
  ['email OCR 공백 보정', parseCard({ text: '£ gdhong@cjeng kr' }).email, 'gdhong@cjeng.kr'],
  ['formatPhone 02 괄호', formatPhone('(02)1234 5678'), '02-1234-5678'],
  ['formatPhone 010', formatPhone('01012345678'), '010-1234-5678'],
  ['formatPhone +82', formatPhone('+82 10-1234-5678'), '010-1234-5678'],
  ['formatPhone +82 서울', formatPhone('+8225551234'), '02-555-1234'],
  ['formatPhone 031', formatPhone('0311234567'), '031-123-4567'],
  ['formatPhone 0505', formatPhone('05051234567'), '0505-123-4567'],
  ['formatPhone 1588', formatPhone('15881234'), '1588-1234'],
  ['hyphenate 입력중', [hyphenatePhone('010'), hyphenatePhone('0101'), hyphenatePhone('01012345'), hyphenatePhone('0212')].join(' '), '010 010-1 010-1234-5 02-12'],
  ['chosung', chosung('홍길동'), 'ㅎㄱㄷ'],
  ['splitName', JSON.stringify(splitName('남궁민수')), JSON.stringify({ family: '남궁', given: '민수' })],
  ['shareText', buildShareText({ name: '홍길동', company: '창조이엔지', title: '부장' }), '이름: 홍길동\n회사명: 창조이엔지\n직책: 부장'],
  ['vcard N', buildVCard({ name: '홍길동', company: 'A;B' }).split('\r\n')[2], 'N:홍;길동;;;'],
];
for (const [name, got, want] of misc) {
  const ok = got === want;
  ok ? pass++ : fail++;
  results.push({ name, errors: ok ? [] : [`기대 "${want}" / 실제 "${got}"`] });
  out.insertAdjacentHTML('beforeend', `<div class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${name} ${ok ? '' : `→ ${got}`}</div>`);
}
document.title = `Parser tests: ${pass} pass, ${fail} fail`;
out.insertAdjacentHTML('afterbegin', `<h2>${pass} 통과 / ${fail} 실패</h2>`);
window.__results = { pass, fail, results };
</script>
</body>
</html>
