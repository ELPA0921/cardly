<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f8fc">
  <meta name="apple-mobile-web-app-title" content="카들리">
  <meta name="description" content="명함을 촬영해 자동으로 정리하고 Google Drive에 보관하는 명함 관리 앱">
  <title>카들리 (Cardly)</title>
  <script>
    // 저장된 화면 모드(라이트/다크)를 그리기 전에 적용 — 깜빡임 방지. '시스템'이면 휴대폰 설정을 따름
    try {
      var t = (JSON.parse(localStorage.getItem('bc.settings.v1')) || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 앱 시작 화면 (앱에서만, 약 1.7초 / 누르면 바로 넘어감) -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-glow"></div>
    <div class="intro-logo"><img src="icons/logo.png" alt=""><span class="intro-shine"></span></div>
    <div class="wordmark intro-word"></div>
    <p class="intro-tag">명함을 찍으면, 알아서 정리되는 명함첩</p>
  </div>
  <script>
    (function () {
      var el = document.getElementById('intro');
      if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) return el.remove();
      var hide = function () {
        if (!el.parentNode) return;
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 500);
      };
      el.addEventListener('click', hide);
      setTimeout(hide, 1700);
    })();
  </script>
  <div id="app" class="app"></div>

  <input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-gallery" accept="image/*" hidden>
  <input type="file" id="file-import" accept=".json,application/json" hidden>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script>
    // 시작하다가 오류가 나면 빈 화면 대신 원인을 보여 줍니다.
    (function () {
      var errors = [];
      function show() {
        var app = document.getElementById('app');
        if (!app || app.children.length || !errors.length) return;
        app.innerHTML = '<div style="padding:24px;font:14px/1.6 sans-serif;color:#b42318;background:#fff;min-height:100vh">' +
          '<h2 style="margin:0 0 12px">카들리를 시작하지 못했습니다</h2><p>이 화면을 캡처해서 보내 주세요.</p>' +
          '<pre style="white-space:pre-wrap;word-break:break-all;background:#fff4f2;padding:12px;border-radius:8px">' +
          errors.join('\n\n').replace(/</g, '&lt;') + '\n\n' + navigator.userAgent.replace(/</g, '&lt;') + '</pre></div>';
      }
      window.addEventListener('error', function (e) {
        if (e.message) errors.push(e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
        else if (e.target && (e.target.src || e.target.href)) errors.push('불러오기 실패: ' + (e.target.src || e.target.href));
        show();
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        errors.push('Promise: ' + ((r && (r.stack || r.message)) || r));
        show();
      });
      setTimeout(function () {
        var app = document.getElementById('app');
        if (app && !app.children.length) {
          errors.push('8초가 지나도 화면이 그려지지 않았습니다.');
          show();
        }
      }, 8000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
